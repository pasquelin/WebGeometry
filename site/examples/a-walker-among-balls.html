<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>A walker among balls</title>
    <meta name="thumbnail" content="3" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #171d28;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <script type="module">
      import { createWorld, geometry, material, object, light, math } from '../runtime/engine.js';
      import { controls, physicsReadouts, seeded } from '../runtime/kit.js';

      // A compiled hall collides with its own triangles, cooked by the compiler: the balls roll on
      // its floor and stop at its walls. You are the walker: the engine's character, whose body is
      // the physics' own, stands on the cooked floor and pushes the balls it meets. A click locks
      // the mouse to look; W A S D walk (Z Q S D on AZERTY), Shift sprints, Space jumps.
      const world = createWorld('view', { controls: 'character', physics: true });
      world.scene.background = math.color('#20252e');
      await world.scene.load('../assets/examples/hall/cache/native/full/manifest.json');
      const sun = light.directional({ intensity: 2.5, castShadow: true });
      sun.position.set(4, 9, 3);
      world.scene.add(
        sun,
        light.hemisphere({ intensity: 1, color: '#ffffff', groundColor: '#555a66' }),
      );
      // The hall's own wall stands at its back; three of the same plaster close its 10 m floor, so
      // neither you nor a ball walks off its open sides. Each: centre x, y, z, then width, height,
      // depth (scripts/docs-examples-walker.test.ts walks the character against these).
      const hallWalls = [
        [0, 2, 4.85, 10, 4, 0.3],
        [-4.85, 2, 0, 0.3, 4, 9.4],
        [4.85, 2, 0, 0.3, 4, 9.4],
      ];
      const plaster = material.meshStandard({ color: '#dad7d1', roughness: 0.9 });
      for (const [x, y, z, width, height, depth] of hallWalls) {
        const wall = object.mesh(geometry.box(width, height, depth), plaster);
        wall.position.set(x, y, z);
        wall.castShadow = wall.receiveShadow = true;
        wall.physics = 'static';
        world.scene.add(wall);
      }
      world.camera.position.set(2.5, world.controls.eyeHeight, 0);
      world.camera.lookAt(0, 1, 0);

      const matter = material.meshStandard({ color: '#e0a33b', roughness: 0.4, physics: 'rubber' });
      const ball = geometry.sphere(0.25, 20, 12),
        next = seeded(9);
      const drop = (count) => {
        for (let i = 0; i < count; i++) {
          const body = object.mesh(ball, matter);
          body.position.set((next() - 0.5) * 6, 3 + next() * 2, (next() - 0.5) * 6);
          body.castShadow = true;
          body.physics = 'dynamic';
          world.scene.add(body);
        }
      };
      drop(40);

      controls({ balls: () => drop(20) }, () => {}, world);

      physicsReadouts(world, ['bodies', 'awake', 'step']);
    </script>
  </body>
</html>
