[package]
name = "trillion3d-compiler"
version = "0.8.0"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"
[lib]
name = "trillion3d_compiler"
path = "src/lib.rs"
[[bin]]
name = "trillion3d-compiler"
path = "src/main.rs"
[[bin]]
name = "trillion3d-oracle"
path = "src/oracle_main.rs"
required-features = ["oracle"]

# The indirect-lighting reference path tracer is a measurement tool, never part of the compiler:
# `pnpm run build:native` and `pnpm run test:native` enable it (`--all-features`) for the bench runner.
[features]
oracle = []
[dependencies]
serde_json = "1"
sha2 = "0.10"
rayon = "1.10"
memmap2 = "0.9"
meshopt = "0.6"
# A portable arc cosine for `dag/quality.rs` (#415), pure Rust from musl (MIT); already in the
# tree through `num-traits`.
libm = "0.2.16"
ufbx = "0.11.3"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "tga", "tiff", "webp", "bmp", "gif"] }
# ZIP archive reading (MIT, zip-rs/zip2), for the `zip` container driver. Stripped of default
# features: only `deflate` through pure Rust `flate2`, neither encryption nor native codec.
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2"] }
# tar.gz archive reading (MIT OR Apache-2.0), for the `unitypackage` container driver: `flate2`
# on its pure Rust backend (miniz_oxide), and `tar` without `xattr`, which would restore extended
# attributes. Decompression only, no editor code.
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
tar = { version = "0.4.46", default-features = false }
yaml-rust2 = { version = "0.13", default-features = false }
# BCn block decoding for the `dds` driver (MIT or Apache-2.0, UniversalGameExtraction/texture2ddecoder,
# notices retained alongside dependency). Pure Rust, without `std` or editor SDK: the entire
# reconstruction defined by the specification, nothing more.
texture2ddecoder = "0.1.2"
# OpenEXR reading (BSD-3-Clause, `johannesvollmer/exrs`, pure Rust without `unsafe`, notices
# retained alongside dependency), for the `exr` driver. Pinned version: names the driver and
# participates in cache identity. No editor code or SDK, no C library.
exr = "1.74.2"
# Basis Universal payload transcoding for the `ktx2` driver — ETC1S under BasisLZ and UASTC LDR 4 × 4 —
# to RGBA8 (Apache-2.0, marcogomez/basisu, notices retained alongside dependency). Pure Rust, without
# `cc` or C++ source: a port of Binomial's reference transcoder, verified bit for bit against it.
# Decoding only, no encoder, no editor code.
basisu = { version = "0.1.0", default-features = false, features = ["std", "zstd"] }
# Zstandard decompression for `ktx2` driver levels (MIT, KillingSpark/zstd-rs). Pure Rust,
# decompression only; `hash` retains checksum verification when carried by a frame, and the
# level's expected length, declared by the container index, bounds read and allocation.
ruzstd = { version = "0.7.3", default-features = false, features = ["std", "hash"] }
# USD reading for the `usd` and `usdz` drivers: `.usda` (text) and `.usdc` (binary "crate") layers,
# and layer composition (MIT, mxpv/openusd, notices retained alongside dependency). Pure Rust,
# without C++ dependency: no editor code or SDK, no Pixar library. Read-only here.
# Pinned version: names the driver and participates in cache identity.
openusd = "0.7.0"
# The page format, shared with the WebAssembly module: its header, its bit fields and its
# dequantization are written there once; the compiler encodes with them, measures its error with
# them, and proves that what it encodes decodes identically.
trillion3d-page-codec = { path = "../page-codec-wasm" }

[build-dependencies]
sha2 = "0.10"

[profile.release]
lto = "thin"
codegen-units = 1
