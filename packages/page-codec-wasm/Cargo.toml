[package]
name = "trillion3d-page-codec"
version = "0.1.0"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"

# `rlib` for the native compiler, testing the decoder against its own encoder;
# `cdylib` for `wasm32-unknown-unknown`, exporting only the ABI of `wasm.rs`.
[lib]
name = "trillion3d_page_codec"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
# The normal cone's arc cosine (`src/normal_cone.rs`): fdlibm's, the same bits on every host and
# in WebAssembly, pure Rust from musl (MIT), without `std`.
libm = "0.2.16"

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
panic = "abort"
